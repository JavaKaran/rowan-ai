services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-sql-query-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-sql-query-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-sql-query-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    expose:
      - "${BACKEND_PORT:-8000}"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GLOBAL_QUERY_RATE_LIMIT: ${GLOBAL_QUERY_RATE_LIMIT:-50}
    volumes:
      - ./backend/app:/app/app
    command: uv run fastapi dev app/main.py --host 0.0.0.0 --port ${BACKEND_PORT:-8000}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-sql-query-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    expose:
      - "3000"
    environment:
      BACKEND_URL: http://backend:${BACKEND_PORT:-8000}
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: npm run dev -- --hostname 0.0.0.0

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  frontend_next:
