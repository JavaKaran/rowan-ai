services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-sql-query-backend
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend/app:/app/app
    command: uv run fastapi dev app/main.py --host 0.0.0.0 --port 8000
