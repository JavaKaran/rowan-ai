services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      REDIS_URL: redis://redis:6379/0
      DATABASE_CONNECTION_ENCRYPTION_KEY: ${DATABASE_CONNECTION_ENCRYPTION_KEY:?DATABASE_CONNECTION_ENCRYPTION_KEY is required}
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY is required}
      QUERY_MODEL_PROVIDER: ${QUERY_MODEL_PROVIDER:-groq}
      QUERY_MODEL_NAME: ${QUERY_MODEL_NAME:-qwen/qwen3.8-27b}
      QUERY_MODEL_MAX_TOKENS: ${QUERY_MODEL_MAX_TOKENS:-800}
      AGENT_RECURSION_LIMIT: ${AGENT_RECURSION_LIMIT:-20}
      GLOBAL_QUERY_RATE_LIMIT: ${GLOBAL_QUERY_RATE_LIMIT:-50}
      GLOBAL_QUERY_RATE_WINDOW_SECONDS: ${GLOBAL_QUERY_RATE_WINDOW_SECONDS:-3600}
    expose:
      - "8000"
    command: >
      sh -c "uv run alembic upgrade head &&
      uv run fastapi run app/main.py --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthy', timeout=3)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: 3000
      BACKEND_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
      DEMO_DB_HOST: ${DEMO_DB_HOST:-}
      DEMO_DB_PORT: ${DEMO_DB_PORT:-5432}
      DEMO_DB_NAME: ${DEMO_DB_NAME:-}
      DEMO_DB_USERNAME: ${DEMO_DB_USERNAME:-}
      DEMO_DB_PASSWORD: ${DEMO_DB_PASSWORD:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
